<html>
<head>
<title>Calendar - Simple year view calendar</title>
<link rel="icon" type="image/png" href="favicon.png">
<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<style>
	body {
		font-family: verdana;
		text-align: center;
		user-select: none;
	}

	div.outer {
		display: inline-block;
	}

	div.month {
		background-color: #deeff8;
		border: #2176ff 1px solid;
		margin: 3px;
		padding: 5px 10px 10px 10px;
	}

	td.calcol, th.calhead {
		text-align: center;
		padding: 5px 5px 5px 5px;
	}

	td.todaycol {
		padding: 0px 4px 0px 4px;
	}

	div.today {
		width: 100%;
		height: 100%;
		border-radius: 5px;
		padding: 1px;
		background-color: #000000;
		color: #ffffff;
	}

	td.sunday {
		color: #df2a2a;
	}

	h1.monthtext {
		padding: 0px 5px 5px 10px;
		font-size: 1.8em;
		margin: 0px;
		color: #416eff;
	}

	div.yeartitle {
		padding: 0px 5px 5px 10px;
		justify-content: space-between;
		margin: 0px;
		color: #ff9441;
		display: flex;
		align-items: center;
	}

	h1.yearnumber {
		padding: 5px;
		margin: 5px;
	}

	h3.prevyear {
		font-size: 0.8em;
    	cursor: pointer;
	}

	h3.nextyear {
		font-size: 0.8em;
    	cursor: pointer;
	}

	div.monthtitle {
		padding: 0px;
		border: 0px;
		text-align: left;
	}	

	div.responsivegrid {
      display: grid;
      grid-template-columns: repeat(4, 1fr); /* Default: 4 columns */
      gap: 5px; /* Space between cells */
      width: 100%;
    }

	@media (max-width: 1072px) {
      div.responsivegrid {
        grid-template-columns: repeat(3, 1fr); /* Switch to 3 columns */
      }
    }

	@media (max-width: 806px) {
      div.responsivegrid {
        grid-template-columns: repeat(2, 1fr);
      }
    }

	@media (max-width: 556px) {
      div.responsivegrid {
        grid-template-columns: repeat(1, 1fr);
      }
    }

	@media print {
  		.no-print {
    		display: none;
  		}
	}

        span.holiday {
                border-style: solid;
                border-color: red;
                border-width: 0px 0px 3px 0px;
                display: block;
        }

        td[data-date] {
                cursor: pointer;
                transition: box-shadow 0.2s ease;
        }

        td[data-date]:hover {
                box-shadow: 0 0 4px rgba(0, 0, 0, 0.3);
        }

	table.calmonth {
		table-layout: fixed;
		border-collapse: collapse;
	}

        tr.calrow {
                width: 120px;
        }

        td.selected, div.selected {
                background-color: #90ee90;
        }

        td.range, div.range {
                background-color: #d8f3d8;
        }

        div.info {
                margin: 15px auto 0 auto;
                font-size: 1.0em;
                background-color: lemonchiffon;
                padding: 8px;
                border: none;
                display: none;
                width: fit-content;
        }

</style>
<script>

var g_year = null;
var g_holidays = null;
var g_startDate = null;
var g_endDate = null;


function createMonthDiv(monthTitle,monthTable) {
	let monthDiv = $('<div>', {
		class: "month"
	});

	let monthTitleDiv = $('<div>', {
		class: "monthtitle"
	});

	let monthText = $('<h1>', {
		class: "monthtext",
		text: monthTitle
	});

	monthTitleDiv.append(monthText);
	monthDiv.append(monthTitleDiv);
	monthDiv.append(monthTable);
	return monthDiv;
}


function createMonthTable() {
	
	let table = $('<table>', {
		class: "calmonth"
	});

	return table;
}


function createMonthHeading() {
	// const weekdays = ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"];
	const weekdays = ["Su", "Mo", "Tu", "We", "Th", "Fr", "Sa"];
	let tr = createMonthRow();

	for (let i=0; i<weekdays.length; i++) {
		let th = $('<th>', {
			class: "calhead",
			text: weekdays[i]
		});
		tr.append(th);
	}

	return tr;
}


function createMonthRow() {
	return $('<tr>', {
		class: "calrow"
	});
	return tr;
}

function formatDate(year, month, day) {
  // Ensure month and day are zero-padded to 2 digits
  const formattedMonth = String(month).padStart(2, '0');
  const formattedDay = String(day).padStart(2, '0');

  return `${year}-${formattedMonth}-${formattedDay}`;
}

function parseDate(dateStr) {
        const parts = dateStr.split('-').map(Number);
        return new Date(parts[0], parts[1] - 1, parts[2]);
}

function addClassToCell(td, className) {
        const inner = td.find('div.today');
        if (inner.length > 0) {
                inner.addClass(className);
        } else {
                td.addClass(className);
        }
}

function resetSelection() {
        $('td.selected, td.range, div.selected, div.range').removeClass('selected range');
        g_startDate = null;
        g_endDate = null;
        $('#infoBox').hide().empty();
}

function updateInfoBox(start, end) {
        const msInDay = 24 * 60 * 60 * 1000;
        const days = Math.round((end - start) / msInDay) + 1;
        const weeks = Math.floor(days / 7);
        const extraDays = days % 7;
        let weekStr = weeks + ' weeks';
        if (extraDays > 0) {
                weekStr += ' and ' + extraDays + ' days';
        }
        $('#infoBox').html(days + ' days<br>' + weekStr).css('display', 'inline-block');
}

function handleDayClick() {
        const dateStr = $(this).data('date');
        if (!dateStr) {
                return;
        }

        if (g_startDate && g_endDate) {
                resetSelection();
        }

        const clicked = parseDate(dateStr);
        if (!g_startDate) {
                g_startDate = clicked;
                addClassToCell($(this), 'selected');
        } else {
                g_endDate = clicked;
                const start = g_startDate <= g_endDate ? g_startDate : g_endDate;
                const end = g_startDate <= g_endDate ? g_endDate : g_startDate;
                $('td[data-date]').each(function() {
                        const current = parseDate($(this).data('date'));
                        if (current >= start && current <= end) {
                                addClassToCell($(this), 'range');
                        }
                });
                const startStr = formatDate(start.getFullYear(), start.getMonth() + 1, start.getDate());
                const endStr = formatDate(end.getFullYear(), end.getMonth() + 1, end.getDate());
                addClassToCell($(`td[data-date='${startStr}']`), 'selected');
                addClassToCell($(`td[data-date='${endStr}']`), 'selected');
                updateInfoBox(start, end);
        }
}


function createMonth(year, monthIndex, startIndex, nDays, selectedDay) {
	const months = ["January", "February", "March", 
					"April", "May", "June", "July", 
					"August", "September", "October", 
					"November", "December"];

	day = 1;
	const monthTitle = months[monthIndex-1]
	let monthTable = createMonthTable();
	let monthDiv = createMonthDiv(monthTitle, monthTable);
	let th = createMonthHeading();
	monthTable.append(th);
	for (let row=0; row<=5; row++) {
		const tr = createMonthRow();
		for (let col=0; col<=6; col++) {
			let dayStr = "&nbsp";
			let tdClass = "calcol";
			let hilightDay = false;

                        let holiday = false;
                        let fmtDate = null;
                        if ((row != 0 || col >= startIndex ) && (day <= nDays)) {
                                dayStr = "" + day;
                                if (col == 0) {
                                        tdClass = tdClass + " sunday";
                                }

                                if (selectedDay == day) {
                                        hilightDay = true;
                                }

                                fmtDate = formatDate(year, monthIndex, day);
                                if (g_holidays != null && g_holidays.includes(fmtDate)) {
                                        holiday = true;
                                }

                                day++;
                        }
                        let td = $('<td>', {class: tdClass});
                        let daySpan = $('<span>', {class: "day"});
                        if (holiday) {
                                daySpan.addClass("holiday");
                        }
                        daySpan.html(dayStr);
                        if (hilightDay) {
                                let innerdiv = $('<div>', {class: "today"});
                                td.addClass("todaycol");
                                innerdiv.append(daySpan);
                                td.append(innerdiv);
                        }
                        else {
                                td.html(daySpan);
                        }

                        if (fmtDate != null) {
                                td.attr('data-date', fmtDate);
                                td.on('click', handleDayClick);
                        }

                        tr.append(td);
                }
                monthTable.append(tr);
        }

	return monthDiv;
}


function dayOfWeek(year, month, day) {
    // Create a new Date object (months are 0-indexed in JavaScript)
    const date = new Date(year, month - 1, day);
    // Get the day index (0 = Sunday, 6 = Saturday)
    return date.getDay();
}


function daysInMonth(year, month) {
    return new Date(year, month, 0).getDate();
}


function pastYear() {
	g_year = g_year - 1;
	createCalendar(g_year)
}


function nextYear() {
	g_year = g_year + 1;
	createCalendar(g_year)
}


function createCalendar(year) {
        resetSelection();
        $('#calendar').empty();
        setYears(year);
        const today = new Date();
	const thisYear = today.getFullYear();
	const thisMonth = today.getMonth() + 1; 
	const thisDay = today.getDate();

	let table = $('<div>', {
		class: "responsivegrid"
	});
	for (let month=1; month<=12; month++) {
		const startIndex = dayOfWeek(year, month, 1);
		const nDays = daysInMonth(year, month);
		let selectedDay = -1;
		if (thisYear == year && thisMonth == month) {
			selectedDay = thisDay;
		}

		const monthDiv = createMonth(year, month, startIndex, nDays, selectedDay);
		table.append(monthDiv);
	}

	$('#calendar').append(table);
}


function setYears(year) {
	$('#yearnumber').text(year);
	$('#prevyear').text(year-1);
	$('#nextyear').text(year+1);
}


function millisUntilTomorrow() {
  const now = new Date();  // Current time
  const tomorrow = new Date();

  // Set to midnight of the next day
  tomorrow.setHours(24, 0, 0, 0);

  // Calculate difference in milliseconds
  return tomorrow - now;
}


function handleTimeout() {
	const today = new Date();
	const thisYear = today.getFullYear();
	if (g_year == thisYear) {
		createCalendar(g_year)
	}
	startUpdateTimer();
}


function startUpdateTimer() {
	const waitTime = millisUntilTomorrow();
	setTimeout(handleTimeout, waitTime);
}

function showInitialCalendar() {
	g_year = new Date().getFullYear();
	createCalendar(g_year);
	startUpdateTimer();
}


function loadHolidays() {
	$.getJSON("data/holidays.json")
		.done(function(data) {
			g_holidays = data;
			showInitialCalendar();
		})
		.fail(function(jqxhr, textStatus, error) {
			g_holidays = null;
			showInitialCalendar();
		});
}

function onLoad() {
        $('#prevyear').click(pastYear);
        $('#nextyear').click(nextYear);
        $('#calendar').on('click', function(e) {
                if ($(e.target).closest('td[data-date]').length === 0) {
                        resetSelection();
                }
        });
        $(document).keydown(function(e) {
                if (e.key === 'Escape') {
                        resetSelection();
                }
        });
        loadHolidays();
}
window.addEventListener("load", (event) => {
	onLoad();
});
</script>

</head>
<body id="mainbody">
<div class="outer" id="outer">
	<div class="yeartitle">
		<h3 class="prevyear no-print" id="prevyear">2024</h3>
		<h1 class="yearnumber" id="yearnumber">2025</h1>
		<h3 class="nextyear no-print" id="nextyear">2026</h3>
	</div>
        <div class="calendar" id="calendar">
        </div>
        <div class="info no-print" id="infoBox"></div>
</div>
</body>
</html>
